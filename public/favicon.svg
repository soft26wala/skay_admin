<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1B3B6F" />
      <stop offset="60%" stop-color="#0E213D" />
      <stop offset="100%" stop-color="#071120" />
    </radialGradient>

    <!-- Metallic Chrome Border -->
    <linearGradient id="chromeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#B8C6DB" />
      <stop offset="50%" stop-color="#E5ECF4" />
      <stop offset="75%" stop-color="#7A8CA3" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Deep Navy Skay Fill -->
    <linearGradient id="navyFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3E72" />
      <stop offset="100%" stop-color="#0B1C38" />
    </linearGradient>

    <!-- Canadian Red Gradient -->
    <linearGradient id="canadaRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2A4B" />
      <stop offset="100%" stop-color="#C4001D" />
    </linearGradient>

    <!-- Facet Gradients for Maple Leaf -->
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D9E4F2" />
    </linearGradient>
    <linearGradient id="facetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B93C4" />
      <stop offset="100%" stop-color="#3D6699" />
    </linearGradient>
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3B6F" />
      <stop offset="100%" stop-color="#0D2040" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle App Badge Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGlow)" stroke="url(#chromeBorder)" stroke-width="8" filter="url(#dropShadow)" />

  <!-- Inner Subtle Glow Ring -->
  <rect x="28" y="28" width="456" height="456" rx="98" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- 1. 3D FACETED MAPLE LEAF (Upper Left/Center) -->
  <g transform="translate(195, 175) scale(0.95)" filter="url(#dropShadow)">
    <!-- Top Center Tip -->
    <polygon points="0,-130 -35,-50 0,0" fill="url(#facetLight)" />
    <polygon points="0,-130 35,-50 0,0" fill="url(#facetMid)" />
    <polygon points="0,-130 65,-40 35,-50" fill="url(#facetDark)" />
    <polygon points="0,-130 -65,-40 -35,-50" fill="url(#facetMid)" />

    <!-- Left Wing -->
    <polygon points="-120,-60 -50,-10 0,0" fill="url(#facetLight)" />
    <polygon points="-120,-60 -60,-80 -35,-50" fill="url(#facetMid)" />
    <polygon points="-120,-60 -50,-10 -85,15" fill="url(#facetDark)" />
    <polygon points="-85,15 -50,-10 0,0" fill="#244B7E" />

    <!-- Right Wing -->
    <polygon points="120,-60 50,-10 0,0" fill="url(#facetDark)" />
    <polygon points="120,-60 60,-80 35,-50" fill="url(#facetMid)" />
    <polygon points="120,-60 50,-10 85,15" fill="url(#facetLight)" />
    <polygon points="85,15 50,-10 0,0" fill="url(#facetMid)" />

    <!-- Lower Lobes -->
    <polygon points="-60,35 -20,20 0,0" fill="url(#facetDark)" />
    <polygon points="-60,35 -40,65 0,0" fill="url(#facetMid)" />
    <polygon points="60,35 20,20 0,0" fill="url(#facetLight)" />
    <polygon points="60,35 40,65 0,0" fill="url(#facetDark)" />
    
    <!-- Central Highlights -->
    <polygon points="0,0 -20,20 0,55" fill="#EBF2FA" />
    <polygon points="0,0 20,20 0,55" fill="#A1B8D4" />
  </g>

  <!-- 2. 3D DELIVERY CUBE (Upper Right) -->
  <g transform="translate(365, 120) scale(0.72)" filter="url(#dropShadow)">
    <!-- Top Face -->
    <polygon points="0,-50 55,-20 0,10 -55,-20" fill="#FFFFFF" stroke="#D1D9E6" stroke-width="1.5" />
    <!-- Left Face -->
    <polygon points="-55,-20 0,10 0,75 -55,45" fill="#EDF2F7" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="0,10 55,-20 55,45 0,75" fill="#D3DDE8" stroke="#94A3B8" stroke-width="1.5" />

    <!-- Package Tape / Seam -->
    <line x1="0" y1="-50" x2="0" y2="10" stroke="#CBD5E1" stroke-width="3" />
    <line x1="-28" y1="-5" x2="28" y2="-35" stroke="#CBD5E1" stroke-width="3" />

    <!-- Navy Maple Leaf on Box Front -->
    <g transform="translate(-28, 26) scale(0.28)">
      <path d="M0,-30 L6,-12 L20,-15 L14,0 L26,8 L10,14 L12,28 L0,18 L-12,28 L-10,14 L-26,8 L-14,0 L-20,-15 L-6,-12 Z" fill="#0C2548" />
    </g>
  </g>

  <!-- 3. MAIN "SKAY" LETTERING -->
  <g transform="translate(62, 335)" filter="url(#dropShadow)">
    <!-- S -->
    <path d="M12,42 C12,18 28,0 52,0 C74,0 88,14 88,34 C88,48 78,58 64,64 L46,72 C36,76 32,82 32,88 C32,96 40,102 52,102 C64,102 74,96 78,88 L92,98 C84,112 70,120 52,120 C28,120 14,104 14,84 C14,68 26,58 40,52 L58,44 C66,40 70,36 70,30 C70,22 62,18 52,18 C40,18 32,24 30,34 Z"
          fill="url(#navyFill)" stroke="url(#chromeBorder)" stroke-width="6" stroke-linejoin="round" />

    <!-- K -->
    <path d="M110,2 L128,2 L128,52 L172,2 L196,2 L150,56 L198,118 L174,118 L134,66 L128,72 L128,118 L110,118 Z"
          fill="url(#navyFill)" stroke="url(#chromeBorder)" stroke-width="6" stroke-linejoin="round" />

    <!-- A -->
    <path d="M246,2 L266,2 L310,118 L290,118 L280,90 L232,90 L222,118 L202,118 Z M256,26 L238,74 L274,74 Z"
          fill="url(#navyFill)" stroke="url(#chromeBorder)" stroke-width="6" stroke-linejoin="round" />

    <!-- Y (Canadian Flag Themed: Red Outer / White Inner with Red Leaf) -->
    <!-- Base chrome outline of Y -->
    <path d="M320,2 L342,2 L362,56 L382,2 L404,2 L372,70 L372,118 L352,118 L352,70 Z"
          fill="#FFFFFF" stroke="url(#chromeBorder)" stroke-width="6" stroke-linejoin="round" />

    <!-- Red Left Wing of Y -->
    <path d="M320,2 L334,2 L353,52 L342,56 Z" fill="url(#canadaRed)" />
    <!-- Red Right Wing of Y -->
    <path d="M390,2 L404,2 L382,56 L371,52 Z" fill="url(#canadaRed)" />

    <!-- Canadian Red Maple Leaf in Center of Y -->
    <g transform="translate(362, 70) scale(0.32)">
      <path d="M0,-32 L5,-12 L22,-16 L15,2 L28,10 L10,16 L12,32 L0,20 L-12,32 L-10,16 L-28,10 L-15,2 L-22,-16 L-5,-12 Z" fill="url(#canadaRed)" />
      <polygon points="-2,16 2,16 3,36 -3,36" fill="url(#canadaRed)" />
    </g>
  </g>

  <!-- 4. SUBTITLE "— PRODUCTS —" -->
  <g transform="translate(0, 470)">
    <!-- Left Horizontal Line -->
    <line x1="70" y1="-8" x2="140" y2="-8" stroke="#8A9BB0" stroke-width="3" stroke-linecap="round" />

    <!-- "PRODUCTS" Text in Canadian Red -->
    <text x="256" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="28" font-weight="900" letter-spacing="10" fill="url(#canadaRed)">
      PRODUCTS
    </text>

    <!-- Right Horizontal Line -->
    <line x1="372" y1="-8" x2="442" y2="-8" stroke="#8A9BB0" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
